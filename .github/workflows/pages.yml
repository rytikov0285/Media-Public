name: Deploy MediaPlatforma to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/**'
      - 'playwright.config.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate static website
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          from datetime import date
          import json
          import xml.etree.ElementTree as ET

          root = Path("site").resolve()
          required = ["index.html", "404.html", "robots.txt", "sitemap.xml", "assets/css/site.css", "assets/js/site.js", "assets/favicon.svg", "about.html", "editorial-policy.html", "privacy.html"]
          for name in required:
              assert (root / name).is_file(), f"Missing required file: site/{name}"

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids, self.links, self.meta, self.canonical = [], [], {}, []
                  self.title, self.title_open, self.h1_count = "", False, 0
                  self.script_type, self.script_src, self.script_text = None, None, ""
                  self.inline_handlers, self.images_without_alt, self.blank_without_noopener = [], [], []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get("id"): self.ids.append(attrs["id"])
                  if tag == "h1": self.h1_count += 1
                  if tag == "title": self.title_open = True
                  if tag == "meta":
                      key = attrs.get("name") or attrs.get("http-equiv")
                      if key: self.meta[key.lower()] = attrs.get("content", "")
                  if tag == "link" and "canonical" in attrs.get("rel", "").lower().split():
                      self.canonical.append(attrs.get("href", ""))
                  for key in ("href", "src"):
                      if attrs.get(key): self.links.append((key, attrs[key]))
                  if tag == "script":
                      self.script_type, self.script_src, self.script_text = attrs.get("type", "").lower(), attrs.get("src"), ""
                  if tag == "img" and "alt" not in attrs: self.images_without_alt.append(attrs)
                  self.inline_handlers.extend(k for k in attrs if k.lower().startswith("on"))
                  if tag == "a" and attrs.get("target") == "_blank" and "noopener" not in attrs.get("rel", "").lower().split():
                      self.blank_without_noopener.append(attrs.get("href", ""))
              def handle_data(self, data):
                  if self.title_open: self.title += data
                  if self.script_type == "application/ld+json": self.script_text += data
              def handle_endtag(self, tag):
                  if tag == "title": self.title_open = False
                  if tag == "script" and self.script_type is not None:
                      if self.script_type == "application/ld+json": json.loads(self.script_text)
                      elif not self.script_src: raise AssertionError("Unexpected inline executable script")
                      self.script_type, self.script_src, self.script_text = None, None, ""

          pages = sorted(root.rglob("*.html"))
          assert len(pages) == 12, f"Expected 12 HTML pages, found {len(pages)}"
          parsed = {}
          for page in pages:
              parser = PageParser()
              parser.feed(page.read_text(encoding="utf-8")); parser.close()
              rel = page.relative_to(root).as_posix()
              assert parser.title.strip(), f"{rel}: missing title"
              assert parser.h1_count == 1, f"{rel}: expected exactly one h1"
              assert len(parser.ids) == len(set(parser.ids)), f"{rel}: duplicate ids"
              assert parser.meta.get("viewport"), f"{rel}: missing viewport"
              assert parser.meta.get("content-security-policy"), f"{rel}: missing CSP"
              assert parser.meta.get("referrer") == "strict-origin-when-cross-origin", f"{rel}: missing referrer policy"
              assert not parser.inline_handlers and not parser.images_without_alt and not parser.blank_without_noopener, f"{rel}: accessibility/security markup issue"
              assert bool(parser.canonical) == (rel != "404.html"), f"{rel}: canonical policy mismatch"
              if rel != "404.html": assert parser.meta.get("description"), f"{rel}: missing description"
              source = page.read_text(encoding="utf-8")
              if 'class="main-nav"' in source:
                  assert 'id="primaryNav"' in source and 'id="menuToggle"' in source, f"{rel}: mobile navigation toggle missing"
                  assert "assets/js/site.js" in source, f"{rel}: navigation JavaScript missing"
              parsed[page] = parser

          errors = []
          for page, parser in parsed.items():
              for kind, value in parser.links:
                  parts = urlsplit(value)
                  if parts.scheme.lower() in ("http", "https", "mailto", "tel") or parts.netloc or value.startswith("//"): continue
                  if parts.scheme: errors.append(f"{page.relative_to(root)}: unsupported URL scheme in {value}"); continue
                  rel_path = unquote(parts.path)
                  target = page if not rel_path else (root / rel_path.lstrip("/") if rel_path.startswith("/") else page.parent / rel_path)
                  if rel_path.endswith("/"): target = target / "index.html"
                  target = target.resolve()
                  if not target.is_relative_to(root): errors.append(f"{page.relative_to(root)}: link escapes site root: {value}"); continue
                  if not target.is_file(): errors.append(f"{page.relative_to(root)}: broken {kind}={value}"); continue
                  if parts.fragment and target.suffix.lower() == ".html" and unquote(parts.fragment) not in set(parsed[target].ids):
                      errors.append(f"{page.relative_to(root)}: missing target anchor {value}")
          assert not errors, "\\n".join(errors)

          base = "https://news4me.ru/"
          sitemap = ET.parse(root / "sitemap.xml")
          locs = [node.text or "" for node in sitemap.findall(".//{*}loc")]
          expected = {p.canonical[0] for page, p in parsed.items() if page.name != "404.html"}
          assert len(locs) == len(set(locs)), "sitemap.xml contains duplicate URLs"
          assert set(locs) == expected, "Sitemap does not exactly match canonical indexable pages"
          assert all(loc.startswith(base) for loc in locs), "Unexpected sitemap URL"
          for node in sitemap.findall(".//{*}lastmod"): date.fromisoformat(node.text or "")
          robots = (root / "robots.txt").read_text(encoding="utf-8")
          assert "User-agent: *" in robots and "Allow: /" in robots
          assert f"Sitemap: {base}sitemap.xml" in robots
          css = (root / "assets/css/site.css").read_text(encoding="utf-8")
          assert "@import" not in css.lower(), "Third-party CSS import is forbidden"
          assert "@media(max-width:620px)" in css.replace(" ", "")
          assert "prefers-reduced-motion:reduce" in css.replace(" ", "")
          print(f"Validated {len(pages)} HTML pages, links/fragments, JSON-LD, security metadata, sitemap and robots.txt")
          PY
          node --check site/assets/js/site.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.65.0
          npx playwright install --with-deps chromium

      - name: Run browser and responsive checks
        run: npx playwright test

      # One-time repository setting: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # GITHUB_TOKEN cannot create the Pages site; do not set enablement: true here.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Inspect GitHub Pages configuration
        id: pages_config
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.request('GET /repos/{owner}/{repo}/pages', {
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            core.info(`Pages URL: ${data.html_url}`);
            core.info(`Custom domain: ${data.cname || '(none)'}`);
            core.info(`HTTPS enforced: ${data.https_enforced}`);
            core.info(`Pages status: ${data.status || '(not reported)'}`);
            if ((data.cname || '').toLowerCase() !== 'news4me.ru') {
              throw new Error(`Unexpected GitHub Pages custom domain: ${data.cname || '(none)'}`);
            }
            core.setOutput('page_url', 'https://news4me.ru/');

      - name: Verify public domain, DNS, TLS and deployed files
        env:
          PAGES_URL: ${{ steps.pages_config.outputs.page_url }}
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import URLError
          from socket import getaddrinfo
          from time import sleep
          import ipaddress, os

          base = os.environ["PAGES_URL"].rstrip("/") + "/"
          expected_v4 = {ipaddress.ip_address(x) for x in (
              "185.199.108.153", "185.199.109.153",
              "185.199.110.153", "185.199.111.153"
          )}
          expected_v6 = {ipaddress.ip_address(x) for x in (
              "2606:50c0:8000::153", "2606:50c0:8001::153",
              "2606:50c0:8002::153", "2606:50c0:8003::153"
          )}
          addresses = {ipaddress.ip_address(item[4][0]) for item in getaddrinfo("news4me.ru", 443)}
          actual_v4 = {x for x in addresses if x.version == 4}
          actual_v6 = {x for x in addresses if x.version == 6}
          if not expected_v4.issubset(actual_v4):
              raise SystemExit(f"DNS A/ALIAS mismatch. Expected all GitHub Pages IPv4 addresses {sorted(map(str, expected_v4))}; got {sorted(map(str, actual_v4))}")
          if actual_v4 - expected_v4:
              raise SystemExit(f"Unexpected extra IPv4 addresses: {sorted(map(str, actual_v4 - expected_v4))}")
          if actual_v6 - expected_v6:
              raise SystemExit(f"Unexpected IPv6 addresses: {sorted(map(str, actual_v6 - expected_v6))}")
          print(f"DNS OK: {sorted(map(str, addresses))}")

          paths = [
              "", "404.html", "about.html", "editorial-policy.html", "privacy.html",
              "articles/household-budget.html", "articles/protect-accounts.html",
              "articles/travel-checklist.html", "articles/verify-information.html",
              "topics/everyday-life.html", "topics/guides.html", "topics/technology.html",
              "assets/css/site.css", "assets/js/site.js", "assets/favicon.svg",
              "robots.txt", "sitemap.xml",
          ]
          for path in paths:
              url = base + path
              last_error = None
              for attempt in range(12):
                  try:
                      request = Request(url, headers={
                          "User-Agent": "MediaPlatforma-deployment-smoke-test",
                          "Accept-Encoding": "identity"
                      })
                      with urlopen(request, timeout=20) as response:
                          body = response.read()
                          final_url = response.geturl()
                          if response.status != 200:
                              raise RuntimeError(f"HTTP {response.status} at {final_url}")
                          if not final_url.startswith("https://news4me.ru/"):
                              raise RuntimeError(f"Unexpected redirect destination: {final_url}")
                          if path == "" and b"MediaPlatforma" not in body:
                              raise RuntimeError("Homepage does not contain MediaPlatforma title")
                          if path.endswith(".html") and b"<html" not in body.lower():
                              raise RuntimeError(f"Not an HTML document: {final_url}")
                      last_error = None
                      break
                  except Exception as exc:
                      last_error = exc
                      if attempt < 11:
                          sleep(5)
              if last_error:
                  raise SystemExit(f"Public endpoint failed: {url}: {last_error}")
              print(f"HTTPS 200 {url}")
          PY

      - name: Enforce HTTPS on GitHub Pages
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.request('GET /repos/{owner}/{repo}/pages', {
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            if (!data.https_enforced) {
              const result = await github.request('PUT /repos/{owner}/{repo}/pages', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                https_enforced: true
              });
              core.info(`HTTPS enforcement enabled: ${result.data.https_enforced}`);
            } else {
              core.info('HTTPS enforcement is already enabled.');
            }
